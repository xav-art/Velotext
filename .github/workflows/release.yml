# Velotext: builds the per-user installer for a version tag (v1.2.3), then publishes it with checksums and a
# build attestation. The build job can only read the repository; the publish job, which runs no project code,
# is the only one that can write. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tags look like v1.2.3." }
          $branches = git branch -r --contains $env:GITHUB_SHA
          if (-not ($branches -match '^\s*origin/main$')) { throw "The tagged commit is not on main." }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build, test and pack
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Publish -Version ($env:GITHUB_REF_NAME.Substring(1))

      - name: Keep the installer files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releases
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Get the installer files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: releases
          path: releases

      - name: Write checksums
        working-directory: releases
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: releases/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Velotext $GITHUB_REF_NAME" \
            --notes "Per-user installer: download and run Velotext-win-Setup.exe. No admin rights needed. Before you run it, compare its SHA-256 with SHA256SUMS.txt, or run: gh attestation verify Velotext-win-Setup.exe --repo $GITHUB_REPOSITORY"